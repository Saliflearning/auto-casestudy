name: Vercel Preview

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview:
    if: ${{ vars.VERCEL_PREVIEWS_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate Vercel configuration
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is required when previews are enabled."; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "VERCEL_ORG_ID is required when previews are enabled."; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID is required when previews are enabled."; exit 1; }

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        run: npx vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        run: npx vercel deploy --prebuilt --token="$VERCEL_TOKEN"
